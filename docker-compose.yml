services:
  homefirst-app:
    build: .
    container_name: homefirst-app
    ports:
      - "3002:3000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://homefirst:homefirst@postgres:5432/homefirst?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-homefirst-dev-auth-secret-change-in-production}
      APP_URL: http://10.1.1.15:3002
      NEXT_PUBLIC_APP_URL: http://10.1.1.15:3002
      TZ: America/Port_of_Spain
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: homefirst-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: homefirst
      POSTGRES_PASSWORD: homefirst
      POSTGRES_DB: homefirst
      TZ: America/Port_of_Spain
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
